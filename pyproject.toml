[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "security-stack-engineering"
version = "0.1.0"
description = "Reference implementation of the Security Stack Engineering (SSE) architecture"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Thor Thor", email = "codethor@gmail.com" }
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
